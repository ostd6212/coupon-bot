<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6fd1"/>
      <stop offset="1" stop-color="#0b3a7a"/>
    </linearGradient>
    <mask id="notches">
      <rect x="180" y="330" width="664" height="364" fill="#fff"/>
      <circle cx="640" cy="330" r="28" fill="#000"/>
      <circle cx="640" cy="694" r="28" fill="#000"/>
    </mask>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04193a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Telegram crops avatars to a circle, so everything stays inside the middle -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="rotate(-8 512 512)">
    <!-- the coupon -->
    <g filter="url(#shadow)">
      <rect x="180" y="330" width="664" height="364" rx="40" fill="#ffffff" mask="url(#notches)"/>
    </g>
    <line x1="640" y1="362" x2="640" y2="662" stroke="#9db4d3" stroke-width="6" stroke-dasharray="14 14" stroke-linecap="round"/>

    <!-- discount -->
    <text x="410" y="540" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="168" font-weight="800" fill="#e1332b">−5 €</text>
    <rect x="270" y="580" width="280" height="14" rx="7" fill="#c9d6ea"/>
    <rect x="310" y="612" width="200" height="14" rx="7" fill="#dfe8f5"/>

    <!-- barcode stub -->
    <g fill="#0b3a7a">
      <rect x="676" y="420" width="10" height="170"/><rect x="698" y="420" width="5" height="170"/>
      <rect x="714" y="420" width="14" height="170"/><rect x="740" y="420" width="6" height="170"/>
      <rect x="757" y="420" width="10" height="170"/><rect x="779" y="420" width="5" height="170"/>
      <rect x="795" y="420" width="12" height="170"/>
    </g>

    <!-- reminder bell -->
    <g transform="translate(806 330)">
      <circle r="104" fill="#e1332b" stroke="#ffffff" stroke-width="12"/>
      <g fill="#ffffff" transform="scale(1.35)">
        <circle cx="0" cy="-47" r="6"/>
        <path d="M-32 20 C-32 -26 -20 -42 0 -42 C20 -42 32 -26 32 20 L44 33 L-44 33 Z"/>
        <circle cx="0" cy="45" r="9"/>
      </g>
    </g>
  </g>
</svg>
